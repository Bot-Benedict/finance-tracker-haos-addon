name: Finance Tracker
version: "0.2.0"
slug: finance_tracker
description: Household finance tracker. Bank statement PDFs in, categorised spending and insights out.
url: https://github.com/Bot-Benedict/finance-tracker-haos-addon
arch:
  - amd64
  - aarch64
# Prebuilt by CI; the Supervisor pulls instead of building.
image: ghcr.io/bot-benedict/finance-tracker
# The image has its own entrypoint, so no s6 init from the Supervisor.
init: false
# Reached only through Home Assistant's ingress proxy; no host port is published.
ingress: true
ingress_port: 8099
panel_icon: mdi:finance
panel_title: Finance
# Show the sidebar entry to non-admin HA users too (the second household member).
# Visibility only: any signed-in HA user can open the ingress URL regardless.
panel_admin: false
options:
  anthropic_api_key: ""
schema:
  anthropic_api_key: password
